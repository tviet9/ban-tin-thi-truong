name: Deploy web
on:
  push:
    branches: [main]
    paths: ["worker/**", "web/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency: deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Kiểm tra secret
        env:
          S1: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          S2: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          S3: ${{ secrets.SITE_PASSWORD }}
        run: |
          miss=""
          [ -z "$S1" ] && miss="$miss CLOUDFLARE_API_TOKEN"
          [ -z "$S2" ] && miss="$miss CLOUDFLARE_ACCOUNT_ID"
          [ -z "$S3" ] && miss="$miss SITE_PASSWORD"
          if [ -n "$miss" ]; then echo "::error::Thiếu secret:$miss (Settings > Secrets and variables > Actions > Repository secrets)"; exit 1; fi
          echo "Đủ secret"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Lấy đúng Account ID từ token
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          RES=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts?per_page=50")
          if [ "$(echo "$RES" | jq -r '.success')" != "true" ]; then
            echo "::error::Token Cloudflare không dùng được: $(echo "$RES" | jq -c '.errors')"; exit 1
          fi
          GIVEN=$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')
          if echo "$RES" | jq -e --arg id "$GIVEN" '.result[] | select(.id==$id)' >/dev/null; then
            ACC="$GIVEN"; echo "Account ID trong secret đúng"
          else
            ACC=$(echo "$RES" | jq -r '.result[0].id')
            echo "::warning::Account ID trong secret không khớp tài khoản của token, dùng ID lấy từ token ($(echo "$RES" | jq '.result | length') tài khoản)"
          fi
          test -n "$ACC" && [ "$ACC" != "null" ]
          echo "::add-mask::$ACC"
          echo "CLOUDFLARE_ACCOUNT_ID=$ACC" >> "$GITHUB_ENV"
      - name: Cài wrangler
        run: npm install -g wrangler@4
      - name: Tạo database D1 nếu chưa có
        working-directory: worker
        run: |
          ID=$(wrangler d1 list --json | jq -r '.[] | select(.name=="ban-tin") | .uuid')
          if [ -z "$ID" ]; then
            wrangler d1 create ban-tin
            ID=$(wrangler d1 list --json | jq -r '.[] | select(.name=="ban-tin") | .uuid')
          fi
          test -n "$ID"
          sed -i "s/__D1_ID__/$ID/" wrangler.toml
      - name: Tạo bảng
        working-directory: worker
        run: wrangler d1 execute ban-tin --remote --file schema.sql --yes
      - name: Đưa web lên
        working-directory: worker
        run: |
          cp ../web/template.html src/template.html
          wrangler deploy
      - name: Cài mật khẩu web
        working-directory: worker
        env:
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
        run: |
          if [ -z "$SITE_PASSWORD" ]; then echo "Chưa có secret SITE_PASSWORD"; exit 1; fi
          printf '%s' "$SITE_PASSWORD" | wrangler secret put SITE_PASSWORD
