name: Chẩn đoán CA
on:
  workflow_dispatch:
    inputs:
      start:
        description: "Từ (UTC, ví dụ 2026-11-26T05:00)"
        type: string
      end:
        description: "Đến (UTC)"
        type: string
      group:
        description: "Một phần tên nhóm (không in ra log)"
        type: string
        default: ""
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lấy đúng Account ID từ token
        run: |
          RES=$(curl -s -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" "https://api.cloudflare.com/client/v4/accounts?per_page=50")
          ACC=$(echo "$RES" | jq -r '.result[0].id')
          echo "::add-mask::$ACC"
          echo "CLOUDFLARE_ACCOUNT_ID=$ACC" >> "$GITHUB_ENV"
      - run: python scripts/diag_ca.py "$S" "$E" "$G"
        env:
          S: ${{ inputs.start }}
          E: ${{ inputs.end }}
          G: ${{ inputs.group }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
