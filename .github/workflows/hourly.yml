name: Cập nhật mỗi giờ
on:
  schedule:
    - cron: "7 * * * *"   # phút 07 mỗi giờ (GitHub có thể trễ vài phút)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hourly
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Kiểm tra secret
        env:
          S1: ${{ secrets.TG_API_ID }}
          S2: ${{ secrets.TG_API_HASH }}
          S3: ${{ secrets.TG_SESSION }}
          S4: ${{ secrets.GROQ_API_KEY }}
          S5: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          S6: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          miss=""
          [ -z "$S1" ] && miss="$miss TG_API_ID"
          [ -z "$S2" ] && miss="$miss TG_API_HASH"
          [ -z "$S3" ] && miss="$miss TG_SESSION"
          [ -z "$S4" ] && miss="$miss GROQ_API_KEY"
          [ -z "$S5" ] && miss="$miss CLOUDFLARE_ACCOUNT_ID"
          [ -z "$S6" ] && miss="$miss CLOUDFLARE_API_TOKEN"
          if [ -n "$miss" ]; then echo "::error::Thiếu secret:$miss"; exit 1; fi
          echo "Đủ secret"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Lấy tin và tóm tắt
        env:
          HIDE_NAMES: "1"   # repo công khai: log không in tên nhóm
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python collector/run_hourly.py
