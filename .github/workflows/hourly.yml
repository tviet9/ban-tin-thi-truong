name: Cập nhật mỗi giờ
on:
  schedule:
    - cron: "37 * * * *"  # dự phòng: lịch chính do Cloudflare gọi lúc phút 07
  workflow_dispatch:
    inputs:
      reset_today:
        description: "Xoá dữ liệu hôm nay rồi chạy lại từ 0 giờ"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: hourly
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Kiểm tra secret
        env:
          S1: ${{ secrets.TG_API_ID }}
          S2: ${{ secrets.TG_API_HASH }}
          S3: ${{ secrets.TG_SESSION }}
          S4: ${{ secrets.GROQ_API_KEY }}
          S5: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          S6: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          miss=""
          [ -z "$S1" ] && miss="$miss TG_API_ID"
          [ -z "$S2" ] && miss="$miss TG_API_HASH"
          [ -z "$S3" ] && miss="$miss TG_SESSION"
          [ -z "$S4" ] && miss="$miss GROQ_API_KEY"
          [ -z "$S5" ] && miss="$miss CLOUDFLARE_ACCOUNT_ID"
          [ -z "$S6" ] && miss="$miss CLOUDFLARE_API_TOKEN"
          if [ -n "$miss" ]; then echo "::error::Thiếu secret:$miss"; exit 1; fi
          echo "Đủ secret"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Lấy đúng Account ID từ token
        run: |
          RES=$(curl -s -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" "https://api.cloudflare.com/client/v4/accounts?per_page=50")
          if [ "$(echo "$RES" | jq -r '.success')" != "true" ]; then
            echo "::error::Token Cloudflare không dùng được: $(echo "$RES" | jq -c '.errors')"; exit 1
          fi
          GIVEN=$(printf '%s' "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" | tr -d '[:space:]')
          if echo "$RES" | jq -e --arg id "$GIVEN" '.result[] | select(.id==$id)' >/dev/null; then
            ACC="$GIVEN"; echo "Account ID trong secret đúng"
          else
            ACC=$(echo "$RES" | jq -r '.result[0].id')
            echo "::warning::Account ID trong secret không khớp tài khoản của token, dùng ID lấy từ token ($(echo "$RES" | jq '.result | length') tài khoản)"
          fi
          test -n "$ACC" && [ "$ACC" != "null" ]
          echo "::add-mask::$ACC"
          echo "CLOUDFLARE_ACCOUNT_ID=$ACC" >> "$GITHUB_ENV"

      - name: Lấy tin và tóm tắt
        env:
          RESET_TODAY: ${{ inputs.reset_today }}
          TRIGGER: ${{ github.event_name }}
          HIDE_NAMES: "1"   # repo công khai: log không in tên nhóm
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python collector/run_hourly.py
