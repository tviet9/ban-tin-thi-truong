name: Giữ lịch chạy hoạt động
# GitHub tắt lịch chạy của repo công khai nếu 60 ngày không có thay đổi. Mỗi tháng tạo 1 commit rỗng.
on:
  schedule:
    - cron: "17 3 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "keepalive: giữ lịch chạy hoạt động"
          git push
