name: Thử nguồn RSS cho X (tạm)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Thử List và từng tài khoản qua Nitter
        run: |
          for path in i/lists/2125786173805388018 5phutcrypto_ MINHxDYNASTY LuckyStudent02 cz_binance elonmusk; do
            body=$(curl -sL -m 25 -A "Mozilla/5.0 (news-digest)" -w '\n%{http_code}' "https://nitter.kareem.one/$path/rss" || true)
            echo "$(printf '%s' "$body" | tail -1) $path items=$(printf '%s' "$body" | grep -o '<item>' | wc -l)"
            printf '%s' "$body" | grep -o '<dc:creator>[^<]*</dc:creator>' | sort | uniq -c | head -6
            printf '%s' "$body" | grep -o '<link>[^<]*</link>' | sed -n '2p'
            sleep 3
          done
