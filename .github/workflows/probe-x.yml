name: Thử nguồn RSS cho X (tạm)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Thử các dịch vụ RSS cho X (tài khoản công khai elonmusk)
        run: |
          for u in \
            https://nitter.net/elonmusk/rss \
            https://nitter.privacydev.net/elonmusk/rss \
            https://nitter.poast.org/elonmusk/rss \
            https://xcancel.com/elonmusk/rss \
            https://nitter.tiekoetter.com/elonmusk/rss \
            https://nitter.space/elonmusk/rss \
            https://lightbrd.com/elonmusk/rss \
            https://nitter.kareem.one/elonmusk/rss \
            https://rsshub.app/twitter/user/elonmusk \
            https://rsshub.rssforever.com/twitter/user/elonmusk ; do
            body=$(curl -sL -m 20 -A "Mozilla/5.0 (news-digest)" -w '\n%{http_code}' "$u")
            code=$(printf '%s' "$body" | tail -1)
            items=$(printf '%s' "$body" | grep -o '<item>' | wc -l)
            echo "$code items=$items $u"
          done
