name: Thử nguồn RSS cho X (tạm)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Thử feed gộp nhiều tài khoản
        run: |
          for h in nitter.kareem.one nitter.tiekoetter.com; do
            u="https://$h/5phutcrypto_,MINHxDYNASTY,LuckyStudent02,cz_binance,elonmusk/rss"
            body=$(curl -sL -m 25 -A "Mozilla/5.0 (news-digest)" "$u" || true)
            echo "$h items=$(printf '%s' "$body" | grep -o '<item>' | wc -l)"
            printf '%s' "$body" | grep -o '<dc:creator>[^<]*</dc:creator>' | sort | uniq -c | head
            printf '%s' "$body" | grep -o '<link>[^<]*</link>' | sed -n '2,3p'
          done
