name: Kiểm tra kết nối
on:
  workflow_dispatch:
    inputs:
      youtube:
        description: "Kênh YouTube để thử (@tên hoặc ID UC...)"
        type: string
        default: "@VTV24"
      url:
        description: "Tuỳ chọn: link một trang để xem cấu trúc (mã trả về, link, đường dẫn API)"
        type: string
        default: ""
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/probe.py "$CH"
        if: ${{ inputs.url == '' }}
        env:
          CH: ${{ inputs.youtube }}
      - run: python scripts/peek.py "$URL"
        if: ${{ inputs.url != '' }}
        env:
          URL: ${{ inputs.url }}
