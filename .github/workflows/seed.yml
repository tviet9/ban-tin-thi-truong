name: Ghi nguồn (mã hoá)
# Nhận danh sách nguồn đã mã hoá bằng TG_API_HASH, giải mã rồi ghi vào database. Log chỉ in số lượng.
on:
  workflow_dispatch:
    inputs:
      payload:
        description: "Dữ liệu nguồn đã mã hoá (openssl aes-256-cbc, base64)"
        required: true

permissions:
  contents: read

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lấy đúng Account ID từ token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          ACC=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts" | jq -r '.result[0].id')
          test -n "$ACC" && [ "$ACC" != "null" ]
          echo "::add-mask::$ACC"
          echo "CLOUDFLARE_ACCOUNT_ID=$ACC" >> "$GITHUB_ENV"
      - name: Giải mã và ghi
        env:
          KEY: ${{ secrets.TG_API_HASH }}
          PAYLOAD: ${{ inputs.payload }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          JSON=$(printf '%s\n' "$PAYLOAD" | openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -a -A -pass env:KEY) || { echo "::error::Giải mã thất bại"; exit 1; }
          echo "::add-mask::$JSON"
          SEED_JSON="$JSON" python collector/seed_sources.py
