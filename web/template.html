<title>Bản tin Thị trường</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: menu mục cố định bên trái, vùng nội dung bên phải có thanh lọc dính trên cùng; dưới 860px menu chuyển thành dải ngang */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --ink:#151a22; --muted:#5d6675; --line:#dde2e9;
  --accent:#0a6c86; --accent-soft:#e2f0f4; --nav:#eef1f4;
  --i1:#8a94a3; --i2:#5f8fa8; --i3:#c58a12; --i4:#d9631e; --i5:#c8283b;
  --up:#178a4c; --down:#c8283b; --warn-bg:#fff4dc; --warn-ink:#7a5200;
  --sans:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1318; --surface:#171c23; --ink:#e7ebf0; --muted:#97a1af; --line:#2a313b;
  --accent:#4fb7d3; --accent-soft:#16303a; --nav:#13181e;
  --i1:#7d8796; --i2:#6aa3bf; --i3:#e0a530; --i4:#f07c3a; --i5:#f05468;
  --up:#3cc27a; --down:#f05468; --warn-bg:#3a2e12; --warn-ink:#f3d28a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1318; --surface:#171c23; --ink:#e7ebf0; --muted:#97a1af; --line:#2a313b;
  --accent:#4fb7d3; --accent-soft:#16303a; --nav:#13181e;
  --i1:#7d8796; --i2:#6aa3bf; --i3:#e0a530; --i4:#f07c3a; --i5:#f05468;
  --up:#3cc27a; --down:#f05468; --warn-bg:#3a2e12; --warn-ink:#f3d28a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--sans);margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{background:var(--surface);border-bottom:1px solid var(--line)}
header.top .in{padding-block:16px 12px;display:flex;flex-wrap:wrap;gap:10px 28px;align-items:end;justify-content:space-between;max-width:1480px;margin:0 auto}
h1{font-size:1.4rem;line-height:1.2;margin:0;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.sub{color:var(--muted);font-size:.83rem;margin-top:4px}
.stats{display:flex;gap:18px;flex-wrap:wrap}
.stat{display:flex;flex-direction:column}
.stat b{font:600 1.1rem var(--mono);font-variant-numeric:tabular-nums}
.stat span{font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.sample{background:var(--warn-bg);color:var(--warn-ink);font-size:.85rem}
.sample .in{padding-block:8px;max-width:1480px;margin:0 auto}
.shell{display:grid;grid-template-columns:232px minmax(0,1fr);max-width:1480px;margin:0 auto;align-items:start}
nav.side{position:sticky;top:env(safe-area-inset-top,0px);max-height:100vh;overflow-y:auto;padding:16px 10px 24px max(12px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:2px}
.navh{font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:12px 10px 4px;font-weight:600}
button{font:inherit;color:inherit;cursor:pointer}
.nav{display:flex;justify-content:space-between;align-items:center;gap:8px;border:0;background:none;text-align:left;padding:7px 10px;border-radius:7px;font-weight:500;color:var(--ink);width:100%}
.nav.sub{padding-left:24px;font-weight:400;font-size:.92rem}
.nav .c{font:500 .75rem var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.nav:hover{background:var(--nav)}
.nav[aria-current="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav[aria-current="true"] .c{color:var(--accent)}
.content{min-width:0;padding-right:max(16px,env(safe-area-inset-right,0px));padding-left:12px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 10px;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;border-bottom:1px solid var(--line)}
.bar h2{font-size:1.15rem;margin:0 8px 0 0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:4px 12px;font-size:.85rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--surface)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);padding:3px 10px;border-radius:999px;font-size:.8rem;white-space:nowrap}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:var(--surface)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#view{padding-block:16px 56px;display:flex;flex-direction:column;gap:12px}
.overview{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.lbl{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 6px;font-weight:600}
.overview p{margin:0;max-width:95ch}
.event{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px 12px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px}
.imp{grid-row:span 3;width:40px;display:flex;flex-direction:column;align-items:center;gap:3px;padding-top:2px}
.imp b{font:700 1.25rem/1 var(--mono);color:var(--c)}
.bars{display:flex;flex-direction:column-reverse;gap:2px}
.bars i{display:block;width:18px;height:4px;border-radius:2px;background:var(--line)}
.bars i.on{background:var(--c)}
.meta{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;font-size:.78rem;color:var(--muted);min-width:0}
.sec{color:var(--accent);font-weight:600}
.tag{font-size:.7rem;font-weight:600;border:1px solid currentColor;border-radius:999px;padding:0 7px;color:var(--i4)}
.event h3{margin:0;font-size:1.02rem;line-height:1.35;text-wrap:balance}
.event ul{margin:2px 0 0;padding-left:18px}
.event li{margin:2px 0}
.why{grid-column:2;font-size:.8rem;color:var(--muted);margin-top:4px}
details.src{grid-column:2;font-size:.82rem;margin-top:4px}
details.src summary{cursor:pointer;color:var(--accent);width:max-content}
.srcmsg{border-left:2px solid var(--line);padding:4px 0 4px 10px;margin:6px 0;color:var(--muted);overflow-wrap:anywhere}
.ca-inline{grid-column:2;display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.ca-pill{font:500 .75rem var(--mono);border:1px solid var(--line);border-radius:6px;padding:2px 8px;background:var(--bg)}
.hour-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-top:8px}
.hour-h h3{font:600 1rem var(--mono);margin:0}
.hour-h span{color:var(--muted);font-size:.82rem}
.empty{color:var(--muted);text-align:center;padding:40px 0}
.note{font-size:.8rem;color:var(--muted);margin:0}
.note code{font:500 .78rem var(--mono)}
.tbl{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.84rem}
th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.68rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;white-space:nowrap}
td.num,th.num{text-align:right}
td.num{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
tr:last-child td{border-bottom:0}
.sym{font-weight:700;overflow-wrap:anywhere}
.small{font-size:.72rem;color:var(--muted);font-family:var(--sans);display:block;margin-top:2px;white-space:normal}
.chain{font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.up{color:var(--up)} .down{color:var(--down)}
.new{font-size:.66rem;font-weight:700;color:var(--i4);margin-left:6px}
.first{font-size:.72rem;color:var(--muted);font-family:var(--sans)}
.copy{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:2px 8px;font:500 .74rem var(--mono);white-space:nowrap}
.acts{display:flex;flex-direction:column;gap:4px;align-items:flex-start}
a{color:var(--accent)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 15px;display:flex;flex-direction:column;gap:5px;min-width:0}
.card .u{font-weight:600;overflow-wrap:anywhere}
.ctx{font-size:.84rem;color:var(--muted);overflow-wrap:anywhere}
.wtext{white-space:pre-wrap;overflow-wrap:anywhere}
.wtag{font-size:.7rem;font-weight:600;padding:0 8px;border-radius:999px;border:1px solid currentColor}
.wtag-chain_moi{color:var(--accent)} .wtag-launchpad{color:var(--i4)} .wtag-nguoi{color:var(--i3)}
.tm{font:600 .8rem var(--mono);color:var(--accent);margin-right:2px;white-space:nowrap}
.daysel{font:inherit;font-size:.82rem;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:3px 8px}
.theme{display:flex;align-items:center;gap:8px;font-size:.78rem;color:var(--muted)}
.set{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.set h3{margin:0;font-size:1rem}
.srcrow{display:flex;justify-content:space-between;gap:12px;align-items:center;border-top:1px solid var(--line);padding-top:8px;min-width:0}
.set h3 + .srcrow{border-top:0;padding-top:0}
.srcrow .v{font:500 .78rem var(--mono);color:var(--muted);overflow-wrap:anywhere}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:5px 12px;font-size:.85rem}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--surface);font-weight:600}
.btn:disabled{opacity:.5;cursor:not-allowed}
.form{display:grid;grid-template-columns:200px minmax(0,1fr) 200px auto;gap:8px;align-items:end}
.form label{display:flex;flex-direction:column;gap:3px;font-size:.75rem;color:var(--muted);min-width:0}
.form input,.form select{font:inherit;font-size:.88rem;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:6px 9px;min-width:0}
@media (max-width:860px){.form{grid-template-columns:1fr}}
.msg{font-size:.85rem}
.msg.err{color:var(--down)} .msg.ok{color:var(--up)}
@media (prefers-reduced-motion:no-preference){.event,.card{transition:border-color .15s}.event:hover,.card:hover{border-color:var(--accent)}}
@media (max-width:860px){
  .shell{grid-template-columns:1fr}
  nav.side{position:sticky;max-height:none;flex-direction:row;overflow-x:auto;padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));gap:4px;background:var(--surface);border-bottom:1px solid var(--line);z-index:6;scrollbar-width:none}
  .navh{display:none}
  .nav,.nav.sub{width:auto;white-space:nowrap;padding:5px 10px;font-size:.88rem}
  .content{padding-left:max(16px,env(safe-area-inset-left,0px))}
  .bar{position:static}
  table{min-width:760px}
}
</style>

<header class="top gut"><div class="in">
  <div><h1>Bản tin Thị trường</h1><div class="sub" id="sub"></div></div>
  <div style="display:flex;flex-direction:column;gap:10px;align-items:flex-end">
    <div class="stats" id="stats"></div>
    <div class="theme" id="dayBox" hidden><label for="daySel">Ngày</label><select id="daySel" class="daysel"></select><a href="/logout">Đăng xuất</a></div>
    <div class="theme">Giao diện <div class="seg" role="group" aria-label="Giao diện"><button data-theme-set="light" id="th-light">Sáng</button><button data-theme-set="dark" id="th-dark">Tối</button><button data-theme-set="auto" id="th-auto">Theo máy</button></div></div>
  </div>
</div></header>
<div class="sample gut" id="sampleBar" hidden><div class="in">Đây là <b>dữ liệu mẫu</b> để xem giao diện. Bản chạy thật sẽ thay bằng tin từ các nhóm của bạn.</div></div>
<div class="shell">
  <nav class="side" id="side" aria-label="Mục tin"></nav>
  <div class="content">
    <div class="bar" id="bar"></div>
    <main id="view"></main>
  </div>
</div>

<script>
const DATA = /*__DATA__*/null;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const IMP_LABEL = {5:"Rất quan trọng",4:"Quan trọng",3:"Đáng chú ý",2:"Tham khảo",1:"Tin đồn / quảng cáo"};
const SECTIONS = DATA?.sections || {};
const TAGS = DATA?.tags || {};
// Mục trong menu. news: lọc sự kiện theo danh sách topic; còn lại là trang riêng.
const NAV = [
  {id:"all", label:"Tất cả tin", news:null},
  {head:"Kinh tế"},
  {id:"kinh_te", label:"Tất cả kinh tế", news:["kinh_te_vn","kinh_te_qt"]},
  {id:"kinh_te_vn", label:"Trong nước", news:["kinh_te_vn"], sub:true},
  {id:"kinh_te_qt", label:"Ngoài nước", news:["kinh_te_qt"], sub:true},
  {head:"Thị trường"},
  {id:"chung_khoan", label:"Chứng khoán", news:["chung_khoan"]},
  {id:"crypto", label:"Crypto", news:["crypto"]},
  {id:"tokens", label:"Bảng token (CA)", sub:true},
  {id:"watch", label:"Theo dõi", sub:true},
  {head:"Khác"},
  {id:"links", label:"Link"},
  {id:"settings", label:"Cài đặt nguồn"},
];
const state = {nav:"all", mode:"digest", minImp:1, tag:"all", watch:"all"};
try { Object.assign(state, JSON.parse(localStorage.getItem("digest-state-v2") || "{}")); } catch(e) {}
const navIds = NAV.filter(n => n.id).map(n => n.id);
if (navIds.includes(location.hash.slice(1))) state.nav = location.hash.slice(1);
if (!navIds.includes(state.nav)) state.nav = "all";
const cur = () => NAV.find(n => n.id === state.nav);

const fmtUsd = v => v == null ? "–" : v >= 1e9 ? "$" + (v/1e9).toFixed(2) + "B" : v >= 1e6 ? "$" + (v/1e6).toFixed(2) + "M" : v >= 1e3 ? "$" + (v/1e3).toFixed(1) + "K" : "$" + Number(v).toFixed(0);
const fmtPrice = v => { if (v == null) return "–"; if (v >= 1) return "$" + v.toLocaleString("en-US",{maximumFractionDigits:4});
  const s = v.toPrecision(4); return "$" + (v < 1e-6 ? Number(s).toExponential(2) : s); };
const fmtTime = iso => { if (!iso) return ""; try { return new Date(iso).toLocaleString("vi-VN",{hour:"2-digit",minute:"2-digit",day:"2-digit",month:"2-digit"}); } catch(e){ return iso; } };
const short = a => a.length > 14 ? a.slice(0,6) + "…" + a.slice(-4) : a;
const pct = v => (v > 0 ? "+" : "") + (Math.abs(v) >= 1000 ? Math.round(v).toLocaleString("en-US") : v.toFixed(1)) + "%";
function save(){ try { localStorage.setItem("digest-state-v2", JSON.stringify({minImp:state.minImp, tag:state.tag, mode:state.mode})); } catch(e) {} }

const allEvents = () => DATA.digest.events;
const passBase = e => e.importance >= state.minImp && (state.tag === "all" || (e.tags||[]).includes(state.tag));
const inNav = (e, n) => !n.news || n.news.includes(e.topic);

function header(){
  $("#sub").textContent = (DATA.generated_at ? `Cập nhật ${fmtTime(DATA.generated_at)} · ` : "Chưa có lần cập nhật nào · ") + `${DATA.groups.length} nguồn` + (DATA.groups.length ? ": " + DATA.groups.join(", ") : "");
  const s = DATA.stats;
  $("#stats").innerHTML = [[s.total,"tin đọc"],[s.kept,"tin liên quan"],[allEvents().length,"sự kiện"],[DATA.tokens.length,"token"],[(DATA.watch||[]).length,"tin theo dõi"]]
    .map(([n,l]) => `<div class="stat"><b>${Number(n).toLocaleString("vi-VN")}</b><span>${l}</span></div>`).join("");
  $("#sampleBar").hidden = !DATA.sample;
  if (DATA.days && DATA.api) {
    const days = DATA.days.includes(DATA.day) ? DATA.days : [DATA.day, ...DATA.days];
    $("#daySel").innerHTML = days.map(d => `<option value="${d}" ${d===DATA.day?"selected":""}>${d.slice(8,10)}/${d.slice(5,7)}/${d.slice(0,4)}</option>`).join("");
    $("#dayBox").hidden = false;
  }
}

function count(n){
  if (n.id === "tokens") return DATA.tokens.length;
  if (n.id === "watch") return (DATA.watch||[]).length;
  if (n.id === "links") return DATA.links.length;
  if (n.id === "settings") { const s = DATA.sources || {}; return (s.telegram||[]).length + (s.websites||[]).length; }
  return allEvents().filter(e => inNav(e, n)).length;
}

function side(){
  $("#side").innerHTML = NAV.map(n => n.head ? `<div class="navh">${esc(n.head)}</div>` :
    `<button class="nav${n.sub?" sub":""}" data-nav="${n.id}" id="nav-${n.id}" aria-current="${state.nav===n.id}"><span>${esc(n.label)}</span><span class="c">${count(n)}</span></button>`).join("");
}

function bar(){
  const n = cur();
  let h = `<h2>${esc(n.label === "Trong nước" || n.label === "Ngoài nước" ? "Kinh tế " + n.label.toLowerCase() : n.label)}</h2>`;
  if (n.news !== undefined) {
    h += `<div class="seg" role="group" aria-label="Cách xem"><button data-mode="digest" aria-pressed="${state.mode==="digest"}">Tổng hợp</button><button data-mode="hours" aria-pressed="${state.mode==="hours"}">Theo giờ</button></div>`;
    h += `<div class="chips">` + [1,3,4,5].map(v => `<button class="chip" data-imp="${v}" aria-pressed="${state.minImp===v}">${v===1?"Mọi mức":"Từ "+v+" điểm"}</button>`).join("") + `</div>`;
    h += `<div class="chips">` + [["all","Mọi nhãn"], ...Object.entries(TAGS)].map(([k,l]) => `<button class="chip" data-tag="${k}" aria-pressed="${state.tag===k}">${esc(l)}</button>`).join("") + `</div>`;
  } else if (n.id === "watch") {
    const w = DATA.watch || [];
    const opts = [["all","Tất cả"], ...Object.entries(DATA.watch_labels || {})];
    const people = [...new Set(w.filter(m => m.tags.includes("nguoi")).map(m => m.sender || m.username))].filter(Boolean);
    h += `<div class="chips">` + opts.map(([k,l]) => `<button class="chip" data-watch="${k}" aria-pressed="${state.watch===k}">${esc(l)} · ${k==="all"?w.length:w.filter(m=>m.tags.includes(k)).length}</button>`).join("")
      + people.map(p => `<button class="chip" data-watch="p:${esc(p)}" aria-pressed="${state.watch==="p:"+p}">${esc(p)}</button>`).join("") + `</div>`;
  }
  $("#bar").innerHTML = h;
}

function pointHtml(p){
  const m = String(p).match(/^((?:\d{1,2}\/\d{1,2}\s+)?\d{1,2}:\d{2})\s*[·\-–—:]\s*([\s\S]*)$/);
  return m ? `<li><span class="tm">${esc(m[1])}</span> ${esc(m[2])}</li>` : `<li>${esc(p)}</li>`;
}

function eventCard(e){
  const c = `var(--i${e.importance})`;
  const bars = [1,2,3,4,5].map(n => `<i class="${n<=e.importance?"on":""}"></i>`).join("");
  const srcs = (e.source_ids||[]).map(id => DATA.messages[id]).filter(Boolean);
  const srcHtml = srcs.length ? `<details class="src"><summary>${srcs.length} tin gốc</summary>${srcs.map(m =>
     `<div class="srcmsg"><b>${esc(m.group)}</b> · ${esc(m.sender||"")} · ${fmtTime(m.date)} · <a href="${esc(m.link)}" target="_blank" rel="noopener">mở trong Telegram</a><br>${esc(m.text)}</div>`).join("")}</details>` : "";
  const cas = (e.contracts||[]).map(a => { const t = DATA.tokens.find(t => t.address === a);
     return `<span class="ca-pill" title="${esc(a)}">${t ? esc(t.symbol)+" · "+fmtPrice(t.price_usd)+" · thanh khoản "+fmtUsd(t.liquidity_usd) : short(a)}</span>`; }).join("");
  const tags = (e.tags||[]).map(t => `<span class="tag">${esc(TAGS[t]||t)}</span>`).join("");
  return `<article class="event" style="--c:${c}">
    <div class="imp" title="${IMP_LABEL[e.importance]}"><b>${e.importance}</b><div class="bars">${bars}</div></div>
    <div class="meta"><span class="sec">${esc(SECTIONS[e.topic]||e.topic)}</span>${tags}<span>${IMP_LABEL[e.importance]}</span></div>
    <h3>${esc(e.title)}</h3>
    <ul>${(e.points||[]).map(pointHtml).join("")}</ul>
    ${e.reason ? `<div class="why">Lý do chấm điểm: ${esc(e.reason)}</div>` : ""}
    ${cas ? `<div class="ca-inline">${cas}</div>` : ""}
    ${srcHtml}
  </article>`;
}

function renderNews(n){
  if (state.mode === "hours") {
    const filtered = state.minImp > 1 || state.tag !== "all" || n.news;
    const out = DATA.hours.map(h => {
      const ev = h.events.filter(e => inNav(e, n) && passBase(e));
      if (filtered && !ev.length) return "";
      const end = h.span > 1 ? "–" + String((Number(h.hour.slice(11,13)) + h.span) % 24).padStart(2,"0") + ":00" : "";
      return `<div class="hour-h"><h3>${esc(h.hour.slice(11))}${end} · ${esc(h.hour.slice(8,10))}/${esc(h.hour.slice(5,7))}</h3><span>${h.count} tin · ${ev.length} sự kiện</span></div>`
        + (n.news ? "" : `<p class="note">${esc(h.overview)}</p>`) + ev.map(eventCard).join("");
    }).join("");
    return out || `<p class="empty">Không có sự kiện khớp bộ lọc.</p>`;
  }
  const ev = allEvents().filter(e => inNav(e, n) && passBase(e));
  const ov = !n.news ? `<section class="overview"><p class="lbl">Tóm tắt chung</p><p>${esc(DATA.digest.overview)}</p></section>` : "";
  return ov + (ev.length ? ev.map(eventCard).join("") : `<p class="empty">Chưa có sự kiện nào trong mục này${state.minImp>1||state.tag!=="all"?" khớp bộ lọc":""}.</p>`);
}

function renderTokens(){
  if (!DATA.tokens.length) return `<p class="empty">Chưa thấy contract nào có giao dịch trên DexScreener.</p>`;
  const rows = DATA.tokens.map((t,i) => {
    const ch = t.change_since_first;
    const cls = ch > 0 ? "up" : ch < 0 ? "down" : "";
    const chg = ch == null ? `<span class="first">Lần đầu được nhắc</span>`
      : `<span class="${cls}">${pct(ch)}</span><span class="small">so với ${fmtPrice(t.base_price)} lúc ${fmtTime(t.base_at)}</span>`;
    const isNew = t.age_hours != null && t.age_hours < 72;
    return `<tr>
      <td><span class="sym">${esc(t.symbol)}</span>${isNew?'<span class="new">MỚI</span>':""}<br><span class="chain">${esc(t.chain)} · ${esc(t.dex)}</span></td>
      <td class="num">${fmtPrice(t.price_usd)}<span class="small">lúc ${fmtTime(t.price_at || DATA.generated_at)}</span></td>
      <td class="num">${chg}</td>
      <td class="num">${fmtUsd(t.volume_24h)}</td>
      <td class="num">${fmtUsd(t.liquidity_usd)}</td>
      <td class="num">${fmtUsd(t.market_cap ?? t.fdv)}</td>
      <td class="num">${esc(t.age)}</td>
      <td class="num">${t.mentions}<span class="small">${t.groups.map(esc).join(", ")}</span></td>
      <td><div class="acts"><button class="copy" data-copy="${esc(t.address)}" id="copy-${i}" title="${esc(t.address)}">${short(t.address)}</button><a href="${esc(t.url)}" target="_blank" rel="noopener">DexScreener</a></div></td></tr>`;
  }).join("");
  return `<p class="note">Giá lấy từ DexScreener lúc cập nhật. Cột "Thay đổi" chỉ có số khi CA đã được nhắc ở lần cập nhật trước, so với giá lúc đó. Thanh khoản và volume cộng tất cả các cặp. Bấm địa chỉ để sao chép CA.</p>
  <div class="tbl"><table><thead><tr><th>Token</th><th class="num">Giá hiện tại</th><th class="num">Thay đổi</th><th class="num">Vol 24h</th><th class="num">Thanh khoản</th><th class="num">Vốn hoá</th><th class="num">Tuổi</th><th class="num">Nhắc</th><th>CA</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

function renderWatch(){
  const w = (DATA.watch || []).filter(m => state.watch === "all" ? true
    : state.watch.startsWith("p:") ? (m.sender || m.username) === state.watch.slice(2) : m.tags.includes(state.watch));
  const hint = `<p class="note">Tin về chain mới, launchpad mới và mọi tin của người bạn theo dõi, mới nhất trước. Thêm người theo dõi trong <code>collector/config.py</code> (WATCH_SENDERS).</p>`;
  if (!w.length) return hint + `<p class="empty">Chưa có tin nào khớp.</p>`;
  return hint + w.map(m => {
    const tags = m.tags.map(t => `<span class="wtag wtag-${t}">${esc(DATA.watch_labels[t] || t)}</span>`).join("");
    const cas = (m.contracts||[]).map(a => { const t = DATA.tokens.find(t => t.address === a);
      return `<span class="ca-pill" title="${esc(a)}">${t ? esc(t.symbol)+" · "+fmtPrice(t.price_usd) : short(a)}</span>`; }).join("");
    const links = (m.links||[]).map(u => `<a href="${esc(u.startsWith("http")?u:"https://"+u)}" target="_blank" rel="noopener">${esc(u)}</a>`).join("<br>");
    return `<article class="card"><div class="meta">${tags}<span><b>${esc(m.sender || m.username || "?")}</b> · ${esc(m.group)} · ${fmtTime(m.date)}</span><a href="${esc(m.link)}" target="_blank" rel="noopener">mở trong Telegram</a></div>
      <div class="wtext">${esc(m.text)}</div>${links ? `<div class="ctx">${links}</div>` : ""}${cas ? `<div class="chips">${cas}</div>` : ""}</article>`;
  }).join("");
}

function renderLinks(){
  if (!DATA.links.length) return `<p class="empty">Chưa có link nào.</p>`;
  return DATA.links.map(l => `<div class="card"><a class="u" href="${esc(l.url.startsWith("http")?l.url:"https://"+l.url)}" target="_blank" rel="noopener">${esc(l.url)}</a>
    <div class="meta"><span>${esc(l.group)} · ${fmtTime(l.date)}</span><a href="${esc(l.msg)}" target="_blank" rel="noopener">tin gốc</a></div>
    <div class="ctx">${esc(l.context)}</div></div>`).join("");
}

const KINDS = {
  telegram: {label:"Nhóm Telegram", ph:"https://web.telegram.org/a/#-100... hoặc @tennhom"},
  website: {label:"Trang web / báo", ph:"https://.../rss hoặc link trang chủ"},
  sender: {label:"Người theo dõi", ph:"@username"},
};
function parseTelegram(v){
  v = v.trim();
  const id = v.match(/#?(-100\d{6,})/); if (id) return id[1];
  const u = v.match(/(?:t\.me\/|@)([A-Za-z0-9_]{4,})/); if (u) return "@" + u[1];
  return /^-?\d+$/.test(v) ? v : null;
}
function renderSettings(){
  const s = DATA.sources || {telegram:[], websites:[], watch_senders:[]};
  const can = !!DATA.api;
  const del = (kind, v) => can ? `<button class="btn" data-del="${kind}" data-val="${esc(v)}">Xoá</button>` : "";
  const block = (title, rows, empty) => `<section class="set"><h3>${title}</h3>${rows.length ? rows.join("") : `<p class="note">${empty}</p>`}</section>`;
  const tg = (s.telegram||[]).map(g => `<div class="srcrow"><div><b>${esc(g.title||"")}</b><div class="v">${esc(g.id)}</div></div>${del("telegram", g.id)}</div>`);
  const web = (s.websites||[]).map(w => `<div class="srcrow"><div><b>${esc(w.title||w.url)}</b><div class="v">${esc(w.url)}</div></div>${del("website", w.url)}</div>`);
  const ppl = (s.watch_senders||[]).map(p => `<div class="srcrow"><div><b>@${esc(String(p).replace(/^@/,""))}</b></div>${del("sender", p)}</div>`);
  const note = can
    ? `<p class="note">Nguồn mới có hiệu lực từ lần cập nhật kế tiếp (tối đa 1 giờ). Nhóm Telegram: tài khoản phụ phải vào nhóm trước.</p>`
    : `<p class="note">Bản này xuất từ Colab nên chưa lưu được nguồn tại đây. Khi web chạy online, bạn thêm và xoá nguồn ngay trên trang này. Hiện tại muốn thêm nguồn thì gửi link cho tôi.</p>`;
  return note + `<section class="set"><h3>Thêm nguồn</h3>
    <form class="form" id="addForm">
      <label>Loại<select id="f-kind" ${can?"":"disabled"}>${Object.entries(KINDS).map(([k,v]) => `<option value="${k}">${v.label}</option>`).join("")}</select></label>
      <label>Link hoặc ID<input id="f-val" placeholder="${KINDS.telegram.ph}" ${can?"":"disabled"} required></label>
      <label>Tên hiển thị (tuỳ chọn)<input id="f-title" placeholder="VD: Tin vĩ mô" ${can?"":"disabled"}></label>
      <button class="btn pri" type="submit" ${can?"":"disabled"}>Thêm</button>
    </form><div class="msg" id="f-msg" role="status"></div></section>`
    + block("Nhóm Telegram", tg, "Chưa có nhóm nào.")
    + block("Trang web / báo", web, "Chưa có trang nào. Thêm link RSS của báo để lấy tin kinh tế, chứng khoán.")
    + block("Người theo dõi", ppl, "Chưa có ai.");
}
async function api(method, body){
  const r = await fetch("api/sources", {method, headers:{"Content-Type":"application/json"}, body: JSON.stringify(body)});
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || ("Lỗi " + r.status));
  return j;
}
document.addEventListener("change", ev => {
  if (ev.target.id === "daySel") { location.search = "?day=" + ev.target.value; return; }
  if (ev.target.id === "f-kind") $("#f-val").placeholder = KINDS[ev.target.value].ph;
});
document.addEventListener("submit", async ev => {
  if (ev.target.id !== "addForm") return;
  ev.preventDefault();
  const kind = $("#f-kind").value, raw = $("#f-val").value.trim(), title = $("#f-title").value.trim(), msg = $("#f-msg");
  let value = raw;
  if (kind === "telegram") { value = parseTelegram(raw); if (!value) { msg.className = "msg err"; msg.textContent = "Không đọc được ID nhóm. Dán link web.telegram.org/a/#-100... hoặc @tennhom."; return; } }
  if (kind === "website" && !/^https?:\/\//.test(value)) value = "https://" + value;
  if (kind === "sender") value = value.replace(/^@/, "");
  try { const j = await api("POST", {kind, value, title}); DATA.sources = j.sources; render(); const m = $("#f-msg"); m.className = "msg ok"; m.textContent = "Đã thêm. Có hiệu lực từ lần cập nhật kế tiếp."; }
  catch(e) { msg.className = "msg err"; msg.textContent = "Chưa thêm được: " + e.message; }
});

function applyTheme(t){
  const root = document.documentElement;
  if (t === "light" || t === "dark") root.setAttribute("data-theme", t); else root.removeAttribute("data-theme");
  document.querySelectorAll("[data-theme-set]").forEach(b => b.setAttribute("aria-pressed", b.dataset.themeSet === (t || "auto")));
}
let THEME = "auto";
try { THEME = localStorage.getItem("digest-theme") || "auto"; } catch(e) {}

function render(){
  side(); bar();
  const n = cur();
  $("#view").innerHTML = n.id === "tokens" ? renderTokens() : n.id === "watch" ? renderWatch() : n.id === "links" ? renderLinks()
    : n.id === "settings" ? renderSettings() : renderNews(n);
}

document.addEventListener("click", ev => {
  const b = ev.target.closest("button"); if (!b) return;
  if (b.dataset.nav) { state.nav = b.dataset.nav; history.replaceState(null, "", "#" + state.nav); window.scrollTo({top:0}); }
  else if (b.dataset.mode) state.mode = b.dataset.mode;
  else if (b.dataset.imp) state.minImp = Number(b.dataset.imp);
  else if (b.dataset.tag) state.tag = b.dataset.tag;
  else if (b.dataset.watch) state.watch = b.dataset.watch;
  else if (b.dataset.themeSet) { THEME = b.dataset.themeSet; try { localStorage.setItem("digest-theme", THEME); } catch(e) {} applyTheme(THEME); return; }
  else if (b.dataset.del) {
    api("DELETE", {kind: b.dataset.del, value: b.dataset.val}).then(j => { DATA.sources = j.sources; render(); })
      .catch(e => { const m = $("#f-msg"); if (m) { m.className = "msg err"; m.textContent = "Chưa xoá được: " + e.message; } });
    return;
  }
  else if (b.dataset.copy) {
    const v = b.dataset.copy, old = b.textContent;
    navigator.clipboard?.writeText(v).then(() => { b.textContent = "Đã chép"; setTimeout(() => b.textContent = old, 1200); })
      .catch(() => { b.textContent = v; });
    return;
  } else return;
  save(); render();
});
window.addEventListener("hashchange", () => { const v = location.hash.slice(1); if (navIds.includes(v)) { state.nav = v; render(); } });

applyTheme(THEME);
if (DATA) { header(); render(); } else { $("#view").innerHTML = `<p class="empty">Chưa có dữ liệu.</p>`; }
</script>
