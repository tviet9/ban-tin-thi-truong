<title>Daily Market</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: menu mục cố định bên trái, vùng nội dung bên phải có thanh lọc dính trên cùng; dưới 860px menu chuyển thành dải ngang */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --ink:#151a22; --muted:#5d6675; --line:#dde2e9;
  --accent:#0a6c86; --accent-soft:#e2f0f4; --nav:#eef1f4;
  --i1:#8a94a3; --i2:#5f8fa8; --i3:#c58a12; --i4:#d9631e; --i5:#c8283b;
  --up:#178a4c; --down:#c8283b; --warn-bg:#fff4dc; --warn-ink:#7a5200;
  --surface-2:#eef1f4; --live:#e0342a;
  --sans:-apple-system,BlinkMacSystemFont,system-ui,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --glass:rgba(243,245,247,.72);
  --ease:cubic-bezier(.23,1,.32,1); /* ease-out mạnh cho chuyển cảnh */
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b0d10; --surface:#13161b; --surface-2:#1a1e24; --ink:#eceef1; --muted:#8e97a4; --line:#23272e;
  --accent:#5cc0da; --accent-soft:#132a31; --nav:#161a20; --glass:rgba(11,13,16,.74); --live:#ff5a4e;
  --i1:#7d8796; --i2:#6aa3bf; --i3:#e0a530; --i4:#f07c3a; --i5:#f05468;
  --up:#3cc27a; --down:#f05468; --warn-bg:#3a2e12; --warn-ink:#f3d28a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b0d10; --surface:#13161b; --surface-2:#1a1e24; --ink:#eceef1; --muted:#8e97a4; --line:#23272e;
  --accent:#5cc0da; --accent-soft:#132a31; --nav:#161a20; --glass:rgba(11,13,16,.74); --live:#ff5a4e;
  --i1:#7d8796; --i2:#6aa3bf; --i3:#e0a530; --i4:#f07c3a; --i5:#f05468;
  --up:#3cc27a; --down:#f05468; --warn-bg:#3a2e12; --warn-ink:#f3d28a; color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:88px;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%} /* không che phần tử đang chọn; bỏ vệt sáng khi chạm; chữ không tự phóng khi xoay ngang */
button,a,select,input,summary{touch-action:manipulation}
button,summary,.chip,.nav{user-select:none;-webkit-user-select:none} /* nhấn giữ nút không bôi đen chữ */
.skip{position:absolute;left:12px;top:-48px;z-index:20;background:var(--accent);color:var(--surface);padding:8px 12px;border-radius:7px;font-weight:600}
.skip:focus{top:12px}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--sans);margin:0;-webkit-font-smoothing:antialiased;transition:background-color .25s ease,color .25s ease}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{background:var(--surface);border-bottom:1px solid var(--line)}
header.top .in{padding-block:16px 12px;display:flex;flex-wrap:wrap;gap:10px 28px;align-items:end;justify-content:space-between;max-width:1260px;margin:0 auto}
h1{font-size:1.5rem;line-height:1.15;margin:0;font-weight:700;letter-spacing:-.022em;text-wrap:balance}
.sub{color:var(--muted);font-size:.83rem;margin-top:4px}
.stats{display:flex;gap:18px;flex-wrap:wrap}
.stat{display:flex;flex-direction:column}
.stat b{font:600 1.1rem var(--mono);font-variant-numeric:tabular-nums}
.stat span{font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.shell{display:grid;grid-template-columns:232px minmax(0,1fr);max-width:1260px;margin:0 auto;align-items:start}
nav.side{position:sticky;top:env(safe-area-inset-top,0px);max-height:100vh;max-height:100dvh;overflow-y:auto;padding:16px 10px 24px max(12px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:2px}
.navh{font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:12px 10px 4px;font-weight:600}
button{font:inherit;color:inherit;cursor:pointer}
.nav{display:flex;justify-content:space-between;align-items:center;gap:8px;border:0;background:none;text-align:left;padding:7px 10px;border-radius:7px;font-weight:500;color:var(--ink);width:100%}
.nav.sub{padding-left:24px;font-weight:400;font-size:.92rem}
.nav .c{font:500 .75rem var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.nav .c.new{color:#fff;background:var(--live);border-radius:999px;min-width:20px;padding:1px 6px;text-align:center;font-weight:700}
.newc{color:var(--live);font-weight:700;font-style:normal}
/* nút lọc: số tin mới là chấm thông báo nhỏ nổi ở góc trên bên phải */
.chip{position:relative}
.chip:has(.newc){margin-right:9px}
.chip .newc{position:absolute;top:-8px;right:-11px;min-width:16px;height:16px;padding:0 4px;border-radius:999px;background:var(--live);color:#fff;
  font:700 .62rem/16px var(--mono);text-align:center;box-shadow:0 0 0 2px var(--bg);pointer-events:none}
.chips{padding-top:4px}
.stat .newc{font:700 .72rem var(--mono);margin-left:5px;vertical-align:super}

.nav[aria-current="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav[aria-current="true"] .c{color:var(--accent)}
.content{min-width:0;padding-right:max(16px,env(safe-area-inset-right,0px));padding-left:12px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--glass);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);padding-block:12px 10px;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
/* mép cuộn mềm thay cho đường kẻ cứng: chỉ hiện khi nội dung trượt dưới thanh lọc */
.bar::after{content:"";position:absolute;left:0;right:0;top:100%;height:12px;pointer-events:none;background:linear-gradient(var(--glass),transparent)}
.bar h2{letter-spacing:-.015em}
.bar h2{font-size:1.15rem;margin:0 8px 0 0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:4px 12px;font-size:.85rem;color:var(--muted)}
.seg{background:var(--bg);padding:2px;gap:2px}
.seg button{border-radius:6px}
.seg button[aria-pressed="true"]{background:var(--surface-2);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);padding:3px 10px;border-radius:999px;font-size:.8rem;white-space:nowrap}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:var(--surface)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#view{padding-block:16px 56px;display:flex;flex-direction:column;gap:12px}
.overview{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.lbl{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 6px;font-weight:600}
.overview p{margin:0;max-width:80ch}
.event,.card{content-visibility:auto;contain-intrinsic-size:auto 160px} /* danh sách dài: chỉ vẽ phần đang thấy */
.event{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px 12px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px}
.event.hot{box-shadow:inset 3px 0 0 var(--c)}
.imp{grid-row:span 3;width:40px;display:flex;flex-direction:column;align-items:center;gap:3px;padding-top:2px}
.imp b{font:700 1.25rem/1 var(--mono);color:var(--c)}
.bars{display:flex;flex-direction:column-reverse;gap:2px}
.bars i{display:block;width:18px;height:4px;border-radius:2px;background:var(--line)}
.bars i.on{background:var(--c)}
.meta{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;font-size:.78rem;color:var(--muted);min-width:0}
.sec{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-weight:600;font-size:.7rem;text-transform:uppercase;letter-spacing:.08em}
.sec::before{content:"";width:3px;height:12px;border-radius:2px;background:var(--sc,var(--accent))}
.sec-kinh_te_vn{--sc:#d9631e} .sec-kinh_te_qt{--sc:#7a6ff0} .sec-chung_khoan{--sc:#178a4c} .sec-crypto{--sc:#c58a12}
.tag{font-size:.7rem;font-weight:600;border:1px solid currentColor;border-radius:999px;padding:0 7px;color:var(--i4)}
.event h3{margin:0;font-size:1.04rem;line-height:1.3;font-weight:650;letter-spacing:-.008em;text-wrap:balance}
.event ul{margin:2px 0 0;padding-left:18px}
.event li{margin:2px 0;overflow-wrap:anywhere}
.event > *{min-width:0}
.event h3,.why{overflow-wrap:anywhere}
.why{grid-column:2;font-size:.8rem;color:var(--muted);margin-top:4px}
details.src{grid-column:2;font-size:.82rem;margin-top:4px}
details.src summary{cursor:pointer;color:var(--accent);width:max-content}
.srcmsg{border-left:2px solid var(--line);padding:4px 0 4px 10px;margin:6px 0;color:var(--muted);overflow-wrap:anywhere}
.ca-inline{grid-column:2;display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.ca-pill{font:500 .75rem var(--mono);border:1px solid var(--line);border-radius:6px;padding:2px 8px;background:var(--bg)}
.tl{position:relative;padding-left:22px;display:flex;flex-direction:column;gap:12px}
.tl::before{content:"";position:absolute;left:5px;top:8px;bottom:8px;width:2px;background:var(--line);border-radius:2px}
.tl .hour-h{position:relative}
.tl .hour-h::before{content:"";position:absolute;left:-22px;top:5px;width:12px;height:12px;border-radius:50%;background:var(--bg);border:2px solid var(--accent)}
.tl .hour-h.now::before{border-color:var(--live);background:var(--live)}
.hour-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-top:8px}
.hour-h h3{font:600 1rem var(--mono);margin:0}
.hour-h span{color:var(--muted);font-size:.82rem}
.empty{color:var(--muted);text-align:center;padding:40px 0}
.note{font-size:.8rem;color:var(--muted);margin:0}
.note code{font:500 .78rem var(--mono)}
.tbl{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.84rem}
th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.68rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;white-space:nowrap}
td.num,th.num{text-align:right}
.tbl th,.tbl td{padding-left:7px;padding-right:7px}
td.num{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
tr:last-child td{border-bottom:0}
.sym{font-weight:700;overflow-wrap:anywhere}
.small{font-size:.72rem;color:var(--muted);font-family:var(--sans);display:block;margin-top:2px;white-space:normal}
.nw{white-space:nowrap!important}
td.who{min-width:130px;max-width:190px}
.whoname{display:block;font-weight:600;font-size:.8rem;overflow-wrap:anywhere}
.seen{display:block;margin-top:3px;font-size:.72rem;color:var(--accent);font-weight:500;white-space:nowrap}
.chain{white-space:nowrap;font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.up{color:var(--up)} .down{color:var(--down)}
.new{font-size:.66rem;font-weight:700;color:var(--i4);margin-left:6px}
.first{font-size:.72rem;color:var(--muted);font-family:var(--sans)}
.copy{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:2px 8px;font:500 .74rem var(--mono);white-space:nowrap}
.acts{display:flex;flex-direction:column;gap:4px;align-items:flex-start}
a{color:var(--accent)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 15px;display:flex;flex-direction:column;gap:5px;min-width:0}
.card .u{font-weight:600;overflow-wrap:anywhere}
.ctx{font-size:.84rem;color:var(--muted);overflow-wrap:anywhere}
.wtext{white-space:pre-wrap;overflow-wrap:anywhere}
.clamp6{display:-webkit-box;-webkit-line-clamp:6;line-clamp:6;-webkit-box-orient:vertical;overflow:hidden}
.clamp2{display:-webkit-box;-webkit-line-clamp:2;line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.more{border:0;background:none;color:var(--accent);padding:0;font-size:.85rem;font-weight:600;align-self:flex-start}
#tokMore{margin-top:4px;align-self:center}
@media (max-width:600px){.stats{display:grid;grid-template-columns:repeat(3,auto);gap:10px 18px;justify-content:start}}
.wtag{font-size:.7rem;font-weight:600;padding:0 8px;border-radius:999px;border:1px solid currentColor}
.wtag-chain_moi{color:var(--accent)} .wtag-launchpad{color:var(--i4)} .wtag-nguoi{color:var(--i3)}
.tbar{display:block;height:4px;border-radius:2px;margin-top:5px;width:var(--w);background:var(--accent);opacity:.7}
.trend-card summary{cursor:pointer;display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:2px 10px;align-items:baseline;list-style:none}
.trend-card summary::-webkit-details-marker{display:none}
.trend-card .rank{font:600 .85rem var(--mono);color:var(--muted);grid-row:span 3}
.trend-card .tterm{font-weight:700;overflow-wrap:anywhere}
.trend-card .tcount{font:600 .85rem var(--mono);text-align:right}
.trend-card .tbar,.trend-card .tacc{grid-column:2/-1}
.trend-card .small{grid-column:2}
.trend-card details[open] summary{margin-bottom:6px}
.dayhead{display:flex;align-items:center;gap:10px;margin:22px 0 2px;font-size:.78rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.dayhead::after{content:"";flex:1;height:1px;background:var(--line)}
#more{padding:18px 0 4px;text-align:center;color:var(--muted);font-size:.82rem}
.tm{font:600 .8rem var(--mono);color:var(--accent);margin-right:2px;white-space:nowrap}
.daysel{font:inherit;font-size:.82rem;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:3px 8px}
.live{display:inline-flex;align-items:center;gap:6px;font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--live)}
.live i{width:8px;height:8px;border-radius:50%;background:var(--live);position:relative}
.live.off{color:var(--muted)} .live.off i{background:var(--muted)}
@media (prefers-reduced-motion:no-preference){.live:not(.off) i::after{content:"";position:absolute;inset:0;border-radius:50%;background:var(--live);animation:pulse 2s cubic-bezier(.23,1,.32,1) infinite}}
@keyframes pulse{from{transform:scale(1);opacity:.6}to{transform:scale(2.6);opacity:0}}
.refresh{border:1px solid var(--line);background:var(--surface);color:var(--accent);border-radius:999px;padding:2px 10px;font-size:.75rem;font-weight:600;margin-left:4px}
.refresh:disabled{color:var(--muted);cursor:default}
#refreshMsg{font-size:.78rem;margin-top:4px}
#refreshMsg:empty{display:none}
.toprow{display:flex;align-items:center;gap:10px}
.iconbtn{display:inline-grid;place-items:center;width:36px;height:36px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--ink)}
.iconbtn .i-sun{display:none}
.is-dark .iconbtn .i-sun{display:block}
.is-dark .iconbtn .i-moon{display:none}
@media (hover:hover) and (pointer:fine){.iconbtn:hover{border-color:var(--accent);color:var(--accent)}}
.theme{display:flex;align-items:center;gap:8px;font-size:.78rem;color:var(--muted)}
.set{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.set h3{margin:0;font-size:1rem}
.srcrow{display:flex;justify-content:space-between;gap:12px;align-items:center;border-top:1px solid var(--line);padding-top:8px;min-width:0}
.set h3 + .srcrow{border-top:0;padding-top:0}
.hs{display:flex;align-items:center;gap:6px;font-size:.75rem;color:var(--muted);margin-top:3px}
.hs .hd{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.hs.ok .hd{background:var(--up)} .hs.bad{color:var(--down)} .hs.bad .hd{background:var(--down)}
.srcrow .v{font:500 .78rem var(--mono);color:var(--muted);overflow-wrap:anywhere}
.srcrow > div{min-width:0}
.srcrow b{overflow-wrap:anywhere}
.srcrow .btn{flex-shrink:0}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:5px 12px;font-size:.85rem}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--surface);font-weight:600}
.btn:disabled{opacity:.5;cursor:not-allowed}
.form{display:grid;grid-template-columns:200px minmax(0,1fr) 200px auto;gap:8px;align-items:end}
.form label{display:flex;flex-direction:column;gap:3px;font-size:.75rem;color:var(--muted);min-width:0}
.form input,.form select{font:inherit;font-size:.88rem;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:6px 9px;min-width:0}
@media (max-width:860px){.form{grid-template-columns:1fr}}
.msg{font-size:.85rem}
.msg.err{color:var(--down)} .msg.ok{color:var(--up)}
/* Phản hồi ngay khi nhấn (không đợi thả tay) */
@media (prefers-reduced-motion:no-preference){
  button{transition:transform .1s var(--ease),background-color .15s ease,color .15s ease}
  button:active{transform:scale(.97)}
  .event,.card{transition:border-color .15s ease}
}
@media (hover:hover) and (pointer:fine){.event:hover,.card:hover{border-color:var(--accent)}.nav:not([aria-current="true"]):hover{background:var(--nav)}}
@media (pointer:coarse){
  input,select,textarea{font-size:16px!important}
  .chip,.seg button,.btn,.copy,.nav{min-height:40px}
  .chip,.seg button{display:inline-flex;align-items:center}
  .more,details.src summary{padding-block:8px}
}
@media (prefers-reduced-transparency:reduce){.bar,nav.side{background:var(--bg)!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important}}
@media (prefers-contrast:more){:root{--line:#9aa3af;--muted:#3d4450}.bar::after{display:none}.bar{border-bottom:1px solid var(--line)}}
@media (min-width:861px) and (max-width:1100px){
  .shell{grid-template-columns:196px minmax(0,1fr)}
  .nav.sub{padding-left:18px}
}
@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr)}
  nav.side{min-width:0}
  nav.side{position:sticky;max-height:none;flex-direction:row;overflow-x:auto;padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));gap:4px;background:var(--glass);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);z-index:6;scrollbar-width:none;overscroll-behavior-x:contain;box-shadow:0 1px 0 var(--line)}
  .navh{display:none}
  .nav,.nav.sub{width:auto;white-space:nowrap;padding:5px 10px;font-size:.88rem}
  .content{padding-left:max(16px,env(safe-area-inset-left,0px))}
  .bar{position:static}
  .bar::after{display:none}
  table{min-width:760px}
}
@media (max-width:640px){
  table{min-width:0}
  .tbl{overflow:visible;background:none;border:0}
  table,tbody,tr,td{display:block}
  thead{display:none}
  tr{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:10px;display:grid;grid-template-columns:1fr 1fr;gap:6px 14px}
  td{border:0;padding:0;text-align:left!important;white-space:normal!important}
  td[data-l]::before{content:attr(data-l);display:block;font:600 .66rem var(--sans);text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
  td:first-child,td:last-child{grid-column:1/-1}
  td:last-child .acts{flex-direction:row;align-items:center;gap:12px}
  .stats{grid-template-columns:repeat(3,minmax(0,auto))}
  header.top .in > div:last-child{align-items:flex-start!important}
  /* điện thoại: nút mặt trăng/mặt trời lên góc phải, cùng hàng tiêu đề */
  header.top .in{position:relative}
  #themeBtn{position:absolute;top:14px;right:0}
  h1{padding-right:48px}
}
</style>

<a class="skip" href="#view">Bỏ qua, đến nội dung</a>
<header class="top gut"><div class="in">
  <div><h1>Daily Market</h1><div class="sub"><span class="live" id="live"><i aria-hidden="true"></i><span id="liveTxt">Đang cập nhật</span></span> <span id="sub"></span> <button class="refresh" id="refreshBtn" type="button">Cập nhật ngay</button></div><div class="msg" id="refreshMsg" role="status"></div></div>
  <div style="display:flex;flex-direction:column;gap:10px;align-items:flex-end">
    <div class="toprow">
      <div class="theme" id="dayBox" hidden><label for="daySel">Ngày</label><select id="daySel" class="daysel"></select></div>
      <button class="iconbtn" id="themeBtn" type="button" aria-label="Chuyển sang nền tối" title="Chuyển sang nền tối">
        <svg class="i-moon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
        <svg class="i-sun" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="stats" id="stats"></div>
  </div>
</div></header>
<div class="shell">
  <nav class="side" id="side" aria-label="Mục tin"></nav>
  <div class="content">
    <div class="bar" id="bar"></div>
    <main id="view" tabindex="-1"></main>
  </div>
</div>

<script>
let DATA = /*__DATA__*/null;
const TODAY = DATA;  // ngày đang mở trang; các ngày cũ tải thêm khi lướt xuống
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const IMP_LABEL = {5:"Rất quan trọng",4:"Quan trọng",3:"Đáng chú ý",2:"Tham khảo",1:"Tin đồn / quảng cáo"};
const SECTIONS = DATA?.sections || {};
const TAGS = DATA?.tags || {};
// Mục trong menu. news: lọc sự kiện theo danh sách topic; còn lại là trang riêng.
const NAV = [
  {id:"all", label:"Tất cả tin", news:null},
  {head:"Kinh tế"},
  {id:"kinh_te", label:"Tất cả kinh tế", news:["kinh_te_vn","kinh_te_qt"]},
  {id:"kinh_te_vn", label:"Trong nước", news:["kinh_te_vn"], sub:true},
  {id:"kinh_te_qt", label:"Ngoài nước", news:["kinh_te_qt"], sub:true},
  {head:"Thị trường"},
  {id:"chung_khoan", label:"Chứng khoán", news:["chung_khoan"]},
  {id:"crypto", label:"Crypto", news:["crypto"]},
  {id:"flow", label:"Dòng tiền", sub:true},
  {id:"watch", label:"Theo dõi", sub:true},
  {id:"tokens", label:"Bảng token (CA)", sub:true},
  {head:"X (Twitter)"},
  {id:"x_posts", label:"Bài đăng X"},
  {id:"x_trend", label:"Trending", sub:true},
  {id:"x_ca", label:"Bảng token (CA)", sub:true},
  {head:"Khác"},
  {id:"links", label:"Link"},
  {id:"settings", label:"Cài đặt nguồn"},
];
const state = {nav:"all", mode:"digest", minImp:1, tag:"all", watch:"all", tokLimit:100, xacc:"all", tkind:"all", fgroup:"all"};
try { Object.assign(state, JSON.parse(localStorage.getItem("digest-state-v2") || "{}")); } catch(e) {}
const navIds = NAV.filter(n => n.id).map(n => n.id);
if (navIds.includes(location.hash.slice(1))) state.nav = location.hash.slice(1);
if (!navIds.includes(state.nav)) state.nav = "all";
const cur = () => NAV.find(n => n.id === state.nav);

const USD = new Intl.NumberFormat("en-US", {style:"currency", currency:"USD", notation:"compact", minimumFractionDigits:0, maximumFractionDigits:2});
const fmtUsd = v => v == null ? "–" : USD.format(v);
const fmtPrice = v => { if (v == null) return "–"; if (v >= 1) return "$" + v.toLocaleString("en-US",{maximumFractionDigits:4});
  if (v > 0 && v < 1e-4) {
    const zeros = Math.ceil(-Math.log10(v)) - 1;             // số chữ số 0 sau dấu phẩy, ví dụ 0.0000873 có 4
    const digits = Math.round(v * Math.pow(10, zeros + 4)).toString().replace(/0+$/, "");
    const sub = String(zeros).replace(/\d/g, d => "₀₁₂₃₄₅₆₇₈₉"[d]);
    return `$0.0${sub}${digits}`;
  }
  return "$" + Number(v.toPrecision(4)); };
const fmtTime = iso => { if (!iso) return ""; try { return new Date(iso).toLocaleString("vi-VN",{hour:"2-digit",minute:"2-digit",day:"2-digit",month:"2-digit"}); } catch(e){ return iso; } };
// Chỉ cho phép link http(s); link lạ (javascript:...) thành "#"
const safeUrl = u => { u = String(u || ""); if (/^https?:\/\//i.test(u)) return esc(u); if (/^(www\.|t\.me\/)/i.test(u)) return esc("https://" + u); return "#"; };
const short = a => a.length > 14 ? a.slice(0,6) + "…" + a.slice(-4) : a;
const pct = v => (v > 0 ? "+" : "") + (Math.abs(v) >= 1000 ? Math.round(v).toLocaleString("en-US")
  : (Math.abs(v) >= 99 && Math.abs(v) < 100) ? v.toFixed(2) : v.toFixed(1)) + "%";
function save(){ try { localStorage.setItem("digest-state-v2", JSON.stringify({minImp:state.minImp, tag:state.tag, mode:state.mode})); } catch(e) {} }

const allEvents = () => DATA.digest.events;
const passBase = e => e.importance >= state.minImp && (state.tag === "all" || (e.tags||[]).includes(state.tag));
const inNav = (e, n) => !n.news || n.news.includes(e.topic);

function header(){
  $("#sub").textContent = (DATA.generated_at ? `· lần cuối ${fmtTime(DATA.generated_at)} · ` : "· chưa có lần cập nhật nào · ") + `${DATA.groups.length} nguồn`;
  // Quá 60 phút (3 lượt 20 phút) không có lượt chạy mới: chuyển sang xám "Tạm dừng" để biết hệ thống có vấn đề
  const age = DATA.generated_at ? (Date.now() - new Date(DATA.generated_at)) / 60000 : Infinity;
  $("#live").classList.toggle("off", !(age < 60));
  $("#liveTxt").textContent = age < 60 ? "Đang cập nhật" : "Tạm dừng";
  $("#sub").title = DATA.groups.join("\n");
  const s = DATA.stats;
  // "+N": mới kể từ lần trước bạn mở web (chỉ khi xem hôm nay)
  const plus = arr => { const k = isLive() ? newCount(arr, SITE_PREV) : 0; return k ? `<i class="newc" title="${k} mới từ lần trước bạn mở web">+${k}</i>` : ""; };
  $("#stats").innerHTML = [[s.total,"tin đọc",""],[s.kept,"tin liên quan",""],[allEvents().length,"sự kiện",plus(allEvents().map(evTs))],
      [DATA.tokens.length,"token",plus(DATA.tokens.map(tokTs))],[(DATA.watch||[]).length,"tin theo dõi",plus((DATA.watch||[]).map(m => ts(m.date)))]]
    .map(([n,l,p]) => `<div class="stat"><b>${Number(n).toLocaleString("vi-VN")}${p}</b><span>${l}</span></div>`).join("");
  if (DATA.days && DATA.api) {
    const days = DATA.days.includes(DATA.day) ? DATA.days : [DATA.day, ...DATA.days];
    $("#daySel").innerHTML = days.map(d => `<option value="${d}" ${d===DATA.day?"selected":""}>${d.slice(8,10)}/${d.slice(5,7)}/${d.slice(0,4)}</option>`).join("");
    $("#dayBox").hidden = false;
  }
}

// ===== Số tin mới kể từ lần cuối mở từng mục (lưu trong trình duyệt này) =====
const SEEN_KEY = "dm_seen_v1";
let SEEN = {};
try { SEEN = JSON.parse(localStorage.getItem(SEEN_KEY) || "{}") || {}; } catch(e) { SEEN = {}; }
const saveSeen = () => { try { localStorage.setItem(SEEN_KEY, JSON.stringify(SEEN)); } catch(e) {} };
const vnToday = () => new Date(Date.now() + 7 * 3600e3).toISOString().slice(0, 10);
const isLive = () => DATA === TODAY && TODAY.day === vnToday();  // chỉ đếm "mới" khi đang xem hôm nay
const prevSeen = {};  // mốc "lần trước" của mục đang xem, để nút lọc vẫn hiện số mới trong lúc xem
let seenNav = null;
const SITE_PREV = SEEN._site || 0;  // lần trước mở web: cho các ô số liệu góc trên
SEEN._site = Date.now(); saveSeen();
function markSeen(id){
  if (!isLive() || seenNav === id) return;
  seenNav = id;
  prevSeen[id] = SEEN[id] || 0;
  SEEN[id] = Date.now(); saveSeen();
}
const since = id => id === seenNav ? prevSeen[id] : (SEEN[id] || 0);
const ts = d => Date.parse(d || "") || 0;
// sự kiện không có giờ gửi: lấy mốc giờ muộn nhất trong các ý "HH:MM · ..." của ngày đang xem
const evTs = e => Math.max(0, ...(e.points||[]).map(p => { const m = /^(\d{1,2}):(\d{2})/.exec(p); return m ? ts(`${DATA.day}T${m[1].padStart(2,"0")}:${m[2]}:00+07:00`) : 0; }));
const tokTs = t => ts(t.first_mention || t.first_seen);
function itemsOf(n){  // [mốc thời gian] của từng mục
  if (n.id === "tokens") return DATA.tokens.filter(fromTg).map(tokTs);
  if (n.id === "x_ca") return DATA.tokens.filter(firstFromX).map(tokTs);
  if (n.id === "watch") return (DATA.watch||[]).map(m => ts(m.date));
  if (n.id === "flow") return (DATA.flow||[]).map(m => ts(m.date));
  if (n.id === "links") return goodLinks().map(l => ts(l.date));
  if (n.id === "x_posts") return (DATA.x_posts||[]).map(p => ts(p.date));
  if (n.id === "x_trend") return (DATA.x_trend||[]).map(t => Math.max(0, ...postsFor(t.term).map(p => ts(p.date))));
  return allEvents().filter(e => inNav(e, n)).map(evTs);
}
const newCount = (stamps, after) => stamps.filter(x => x > after).length;
// Mục có nút lọc: đọc theo từng nút. Mỗi tin thuộc một hoặc nhiều nút; tin coi là đã đọc khi bạn đã mở
// một nút chứa nó (hoặc bấm "Tất cả") sau lúc tin đến. Số của mục trên menu = số tin chưa đọc còn lại.
const CHIPSEC = {
  watch:   () => (DATA.watch||[]).map(m => ({t: ts(m.date), keys: m.tags.concat(m.tags.includes("nguoi") && (m.sender || m.username) ? ["p:" + (m.sender || m.username)] : [])})),
  flow:    () => (DATA.flow||[]).map(m => ({t: ts(m.date), keys: [m.group]})),
  x_posts: () => (DATA.x_posts||[]).map(p => ({t: ts(p.date), keys: [p.group]})),
  x_trend: () => (DATA.x_trend||[]).map(x => ({t: Math.max(0, ...postsFor(x.term).map(p => ts(p.date))), keys: [x.kind]})),
};
const CHIPSTATE = {watch: "watch", flow: "fgroup", x_posts: "xacc", x_trend: "tkind"};
const readAt = (sec, it) => Math.max(SEEN[sec] || 0, SEEN[sec + ":all"] || 0, ...it.keys.map(k => SEEN[sec + ":" + k] || 0));
const unreadIn = (sec, key) => CHIPSEC[sec]().filter(it => (key === "all" || it.keys.includes(key)) && it.t > readAt(sec, it)).length;
function markChip(sec, key){ if (isLive()) { SEEN[sec + ":" + key] = Date.now(); saveSeen(); } }
let allClicked = false;  // "Tất cả" chỉ tính là đã đọc hết khi bạn bấm hẳn vào nó, không phải lúc vừa mở mục
const badge = k => k ? `<b class="newc" title="${k} tin chưa đọc">${k > 99 ? "99+" : k}</b>` : "";
const chipNum = (sec, key) => isLive() ? badge(unreadIn(sec, key))
  : ` · ${CHIPSEC[sec]().filter(it => key === "all" || it.keys.includes(key)).length}`;
function srcErrors(){
  const h = (DATA.sources||{}).health || {};
  return Object.entries(h).filter(([k, v]) => !k.startsWith("svc:") && v.err_at && (!v.ok_at || v.err_at > v.ok_at)).length;
}
function navNum(n){
  if (n.id === "settings") { const e = srcErrors(); return e ? `<span class="c new" title="${e} nguồn đang lỗi">${e}</span>` : `<span class="c"></span>`; }
  if (!isLive()) return `<span class="c">${count(n)}</span>`;
  const k = CHIPSEC[n.id] ? unreadIn(n.id, "all") : state.nav === n.id ? 0 : newCount(itemsOf(n), since(n.id));
  return k ? `<span class="c new" title="${k} tin mới từ lần cuối bạn xem">${k}</span>` : `<span class="c"></span>`;
}

function count(n){
  if (n.id === "tokens") return DATA.tokens.filter(fromTg).length;
  if (n.id === "watch") return (DATA.watch||[]).length;
  if (n.id === "flow") return (DATA.flow||[]).length;
  if (n.id === "links") return goodLinks().length;
  if (n.id === "x_posts") return (DATA.x_posts||[]).length;
  if (n.id === "x_trend") return (DATA.x_trend||[]).length;
  if (n.id === "x_ca") return DATA.tokens.filter(firstFromX).length;
  if (n.id === "settings") { const s = DATA.sources || {}; return (s.telegram||[]).length + (s.websites||[]).length + (s.x||[]).length; }
  return allEvents().filter(e => inNav(e, n)).length;
}

function side(){
  $("#side").innerHTML = NAV.map(n => n.head ? `<div class="navh">${esc(n.head)}</div>` :
    `<button class="nav${n.sub?" sub":""}" data-nav="${n.id}" id="nav-${n.id}" aria-current="${state.nav===n.id}"><span>${esc(n.label)}</span>${navNum(n)}</button>`).join("");
}

function bar(){
  const n = cur();
  let h = `<h2>${esc(n.label === "Trong nước" || n.label === "Ngoài nước" ? "Kinh tế " + n.label.toLowerCase() : n.id === "x_ca" ? "Bảng token (CA) từ X" : n.id === "tokens" ? "Bảng token (CA) từ Telegram" : n.label)}</h2>`;
  if (n.news !== undefined) {
    h += `<div class="seg" role="group" aria-label="Cách xem"><button data-mode="digest" aria-pressed="${state.mode==="digest"}">Tổng hợp</button><button data-mode="hours" aria-pressed="${state.mode==="hours"}">Theo giờ</button></div>`;
    h += `<div class="chips">` + [1,3,4,5].map(v => `<button class="chip" data-imp="${v}" aria-pressed="${state.minImp===v}">${v===1?"Mọi mức":"Từ "+v+" điểm"}</button>`).join("") + `</div>`;
    h += `<div class="chips">` + [["all","Mọi nhãn"], ...Object.entries(TAGS)].map(([k,l]) => `<button class="chip" data-tag="${k}" aria-pressed="${state.tag===k}">${esc(l)}</button>`).join("") + `</div>`;
  } else if (n.id === "x_posts") {
    const acc = [...new Set((DATA.x_posts||[]).map(p => p.group))];
    const ps = DATA.x_posts || [];
    h += `<div class="chips">` + [["all","Tất cả"], ...acc.map(a => [a, a.replace(/^X · /, "")])].map(([k,l]) =>
      `<button class="chip" data-xacc="${esc(k)}" aria-pressed="${state.xacc===k}">${esc(l)}${chipNum("x_posts", k)}</button>`).join("") + `</div>`;
  } else if (n.id === "x_trend") {
    // lọc nhanh theo loại: Mã ($), Hashtag (#), Tài khoản (@), Từ khoá
    const tr = DATA.x_trend || [];
    const kinds = [...new Set(tr.map(t => t.kind))];
    h += `<div class="chips">` + [["all","Tất cả"], ...kinds.map(k => [k, k])].map(([k,l]) =>
      `<button class="chip" data-tkind="${esc(k)}" aria-pressed="${state.tkind===k}">${esc(l)}${chipNum("x_trend", k)}</button>`).join("") + `</div>`;
  } else if (n.id === "flow") {
    const fl = DATA.flow || [];
    const grs = [...new Set(fl.map(m => m.group))];
    h += `<div class="chips">` + [["all","Tất cả"], ...grs.map(g => [g, g])].map(([k,l]) =>
      `<button class="chip" data-fgroup="${esc(k)}" aria-pressed="${state.fgroup===k}">${esc(l)}${chipNum("flow", k)}</button>`).join("") + `</div>`;
  } else if (n.id === "watch") {
    const w = DATA.watch || [];
    const opts = [["all","Tất cả"], ...Object.entries(DATA.watch_labels || {})];
    const people = [...new Set(w.filter(m => m.tags.includes("nguoi")).map(m => m.sender || m.username))].filter(Boolean);
    h += `<div class="chips">` + opts.map(([k,l]) => `<button class="chip" data-watch="${k}" aria-pressed="${state.watch===k}">${esc(l)}${chipNum("watch", k)}</button>`).join("")
      + people.map(p => `<button class="chip" data-watch="p:${esc(p)}" aria-pressed="${state.watch==="p:"+p}">${esc(p)}${chipNum("watch", "p:" + p)}</button>`).join("") + `</div>`;
  }
  $("#bar").innerHTML = h;
}

function pointHtml(p){
  const m = String(p).match(/^((?:\d{1,2}\/\d{1,2}\s+)?\d{1,2}:\d{2})\s*[·\-–—:]\s*([\s\S]*)$/);
  if (!m) return `<li>${esc(p)}</li>`;
  // Chỉ có giờ: thêm ngày của trang đang xem (mọi sự kiện trong trang thuộc ngày đó, giờ VN)
  const d = DATA.day || (DATA.generated_at || "").slice(0, 10);
  const [date, time] = m[1].includes("/") ? m[1].split(/\s+/) : [d ? `${d.slice(8,10)}/${d.slice(5,7)}` : "", m[1]];
  const t = date ? `${time} ${date}` : time;  // giờ trước, ngày sau: 08:35 25/11
  return `<li><span class="tm">${esc(t)}</span> ${esc(m[2])}</li>`;
}

function eventCard(e){
  const c = `var(--i${e.importance})`;
  const bars = [1,2,3,4,5].map(n => `<i class="${n<=e.importance?"on":""}"></i>`).join("");
  const srcs = (e.source_ids||[]).map(id => DATA.messages[id]).filter(Boolean);
  const srcHtml = srcs.length ? `<details class="src"><summary>${srcs.length} tin gốc</summary>${srcs.map(m =>
     `<div class="srcmsg"><b>${esc(m.group)}</b> · ${esc(m.sender||"")} · ${fmtTime(m.date)} · <a href="${safeUrl(m.link)}" target="_blank" rel="noopener">${/t\.me\//.test(m.link||"") ? "mở trong Telegram" : "mở bài gốc"}</a><br>${esc(m.text)}</div>`).join("")}</details>` : "";
  const cas = (e.contracts||[]).map(a => { const t = DATA.tokens.find(t => t.address === a);
     return `<span class="ca-pill" translate="no" title="${esc(a)}">${t ? esc(t.symbol)+" · "+fmtPrice(t.price_usd)+" · thanh khoản "+fmtUsd(t.liquidity_usd) : short(a)}</span>`; }).join("");
  const tags = (e.tags||[]).map(t => `<span class="tag">${esc(TAGS[t]||t)}</span>`).join("");
  return `<article class="event${e.importance >= 4 ? " hot" : ""}" style="--c:${c}">
    <div class="imp" role="img" aria-label="Mức ${e.importance}/5: ${IMP_LABEL[e.importance]}" title="${IMP_LABEL[e.importance]}"><b aria-hidden="true">${e.importance}</b><div class="bars" aria-hidden="true">${bars}</div></div>
    <div class="meta"><span class="sec sec-${esc(e.topic)}">${esc(SECTIONS[e.topic]||e.topic)}</span>${tags}<span>${IMP_LABEL[e.importance]}</span></div>
    <h3>${esc(e.title)}</h3>
    <ul>${(e.points||[]).map(pointHtml).join("")}</ul>
    ${e.reason ? `<div class="why">Lý do chấm điểm: ${esc(e.reason)}</div>` : ""}
    ${cas ? `<div class="ca-inline">${cas}</div>` : ""}
    ${srcHtml}
  </article>`;
}

function renderNews(n){
  if (state.mode === "hours") {
    const filtered = state.minImp > 1 || state.tag !== "all" || n.news;
    const out = DATA.hours.map((h, i) => {
      const ev = h.events.filter(e => inNav(e, n) && passBase(e));
      if (filtered && !ev.length) return "";
      const end = h.span > 1 ? "–" + String((Number(h.hour.slice(11,13)) + h.span) % 24).padStart(2,"0") + ":00" : "";
      return `<div class="hour-h${i === 0 && DATA === TODAY ? " now" : ""}"><h3>${esc(h.hour.slice(11))}${end} · ${esc(h.hour.slice(8,10))}/${esc(h.hour.slice(5,7))}</h3><span>${h.count} tin · ${ev.length} sự kiện</span></div>`
        + (n.news ? "" : `<p class="note">${esc(h.overview)}</p>`) + ev.map(eventCard).join("");
    }).join("");
    return out ? `<div class="tl">${out}</div>` : `<p class="empty">Không có sự kiện khớp bộ lọc.</p>`;
  }
  const ev = allEvents().filter(e => inNav(e, n) && passBase(e));
  const ov = !n.news ? `<section class="overview"><p class="lbl">Tóm tắt chung</p><p>${esc(DATA.digest.overview)}</p></section>` : "";
  return ov + (ev.length ? ev.map(eventCard).join("") : `<p class="empty">Chưa có sự kiện nào trong mục này${state.minImp>1||state.tag!=="all"?" khớp bộ lọc":""}.</p>`);
}

// Lần đầu CA xuất hiện: giờ + nơi (nhóm Telegram hoặc tài khoản X)
function firstSeen(t){
  const at = t.first_mention || t.first_seen;
  if (!at) return "";
  return `<span class="seen">Xuất hiện ${fmtTime(at)}</span>`;
}
// Ai gửi CA đầu tiên: tài khoản X (@tên) hoặc người gửi + nhóm Telegram
function firstWho(t){
  const g = t.first_group || (t.groups || [])[0] || "", isX = g.startsWith("X · ");
  const who = isX ? g.slice(4) : (t.first_sender || "");
  if (!who && !g) return `<span class="small">–</span>`;
  return `<span class="whoname">${esc(who || "Không rõ tên")}</span><span class="small">${isX ? "X" : "Telegram · " + esc(g)}</span>`;
}
// CA được nhắc trong ít nhất một nhóm Telegram (CA chỉ có trên X nằm ở bảng token của mục X)
// Mỗi CA nằm ở bảng của nơi được gửi LẦN ĐẦU: gửi đầu trên X -> bảng X, còn lại -> bảng Telegram.
// CA cũ chưa ghi nơi gửi đầu: chỉ được nhắc trên X thì tính là X.
const isXGroup = g => /^X( · |$)/.test(g || "");
const firstFromX = t => t.first_group ? isXGroup(t.first_group) : !(t.groups || []).some(g => !isXGroup(g));
const fromTg = t => !firstFromX(t);
function renderTokens(onlyX){

    // giá lần đầu = giá DexScreener ở lượt cập nhật đầu tiên sau khi CA được gửi
    const p0 = t.base_price ?? t.price_usd, p0at = t.base_price != null ? t.base_at : t.price_at;

      <td><span class="sym">${esc(t.symbol)}</span>${isNew?'<span class="new">MỚI</span>':""}<br><span class="chain">${esc(t.chain)} · ${esc(t.dex)}</span>${firstSeen(t)}</td>
      <td class="who" data-l="Gửi lần đầu">${firstWho(t)}</td>
      <td class="num" data-l="Giá lần đầu">${fmtPrice(p0)}<span class="small nw">lúc ${fmtTime(p0at)}</span></td>

// Bỏ dấu tiếng Việt để so từ khoá ("lai suat" khớp "lãi suất")
const plain = t => String(t||"").normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/đ/g, "d").replace(/Đ/g, "D").toLowerCase();
function postsFor(term){
  const k = plain(term);
  const re = /^[$#@]/.test(term) ? null : new RegExp(`(^|[^a-z0-9])${k.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")}($|[^a-z0-9])`);
  return (DATA.x_posts||[]).filter(p => { const t = plain(p.text); return re ? re.test(t) : t.includes(k); });
}
function renderXTrend(){
  const all = DATA.x_trend || [];

    tr.map((t, i) => {

      return `<article class="card trend-card">
        <details>

function parseTelegram(v){
  v = v.trim();
  const id = v.match(/#?(-100\d{6,})/); if (id) return id[1];
  const u = v.match(/(?:t\.me\/|@)([A-Za-z0-9_]{4,})/); if (u) return "@" + u[1];
  return /^-?\d+$/.test(v) ? v : null;
}

  if (kind === "x") {  // nhận link List, link tài khoản, @tên hoặc link RSS
    const list = value.match(/(?:x|twitter)\.com\/i\/lists\/(\d+)/i), acc = value.match(/^(?:https?:\/\/)?(?:www\.)?(?:x|twitter)\.com\/([A-Za-z0-9_]{1,15})\/?$/i);
    value = list ? "list:" + list[1] : acc ? "@" + acc[1] : /^@?[A-Za-z0-9_]{1,15}$/.test(value) ? "@" + value.replace(/^@/, "") : value;
    if (!/^(list:\d+|@\w+|https?:\/\/)/.test(value)) { msg.className = "msg err"; msg.textContent = "Dán link List (x.com/i/lists/…), link tài khoản x.com/tên hoặc @tên."; return; }
  }
  try { const j = await api("POST", {kind, value, title}); DATA.sources = j.sources; render(); const m = $("#f-msg"); m.className = "msg ok"; m.textContent = "Đã thêm. Có hiệu lực từ lần cập nhật kế tiếp."; }
  catch(e) { msg.className = "msg err"; msg.textContent = "Chưa thêm được: " + e.message; }
});

function applyTheme(t){
  const root = document.documentElement;
  if (t === "light" || t === "dark") root.setAttribute("data-theme", t); else root.removeAttribute("data-theme");
  document.querySelectorAll('meta[name="theme-color"]').forEach(m => {
    if (!m.dataset.media) m.dataset.media = m.media;
    m.media = t === "auto" ? m.dataset.media : "all";
    if (t !== "auto") m.content = t === "dark" ? "#171c23" : "#ffffff";
    else m.content = m.dataset.media.includes("dark") ? "#171c23" : "#ffffff";
  });
  // Biểu tượng: đang tối thì hiện mặt trời (bấm để sang sáng), đang sáng thì hiện mặt trăng
  const dark = t === "dark" || (t !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
  root.classList.toggle("is-dark", dark);
  const label = dark ? "Chuyển sang nền sáng" : "Chuyển sang nền tối";
  const btn = document.getElementById("themeBtn");
  if (btn) { btn.setAttribute("aria-label", label); btn.title = label; }
}
try { matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => applyTheme(THEME)); } catch(e) {}
let THEME = "auto";
try { THEME = localStorage.getItem("digest-theme") || "auto"; } catch(e) {}

// Nút "Cập nhật ngay": nhờ máy chủ gọi lượt cập nhật, rồi hỏi lại mỗi 20 giây, có dữ liệu mới thì tải lại trang
async function refreshNow(b){
  const msg = $("#refreshMsg");
  b.disabled = true; b.textContent = "Đang gửi…"; msg.className = "msg"; msg.textContent = "";
  try {
    const before = DATA.generated_at;
    const r = await fetch("api/refresh", {method:"POST", headers:{"Content-Type":"application/json"}, body:"{}"});
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || ("Lỗi " + r.status));
    b.textContent = "Đang cập nhật…";
    msg.textContent = "Đã gửi lệnh. Thường mất 2–5 phút, trang sẽ tự tải lại khi có dữ liệu mới.";
    const t0 = Date.now();
    const poll = setInterval(async () => {
      const s = await fetch("api/status").then(x => x.json()).catch(() => ({}));
      if (s.last_run && s.last_run !== before) { clearInterval(poll); location.reload(); }
      else if (Date.now() - t0 > 12 * 60000) { clearInterval(poll); b.disabled = false; b.textContent = "Cập nhật ngay"; msg.textContent = "Chưa thấy dữ liệu mới sau 12 phút. Thử tải lại trang sau."; }
    }, 20000);
  } catch(e) {
    b.disabled = false; b.textContent = "Cập nhật ngay";
    msg.className = "msg err"; msg.textContent = e.message;
  }
}

let fadeIn = false;
const calm = () => { try { return matchMedia("(prefers-reduced-motion: reduce)").matches; } catch(e) { return true; } };
// Dòng tin xuyên suốt: các mục dạng danh sách lướt xuống sẽ nối tiếp tin của những ngày trước
const FEED = new Set(["all","kinh_te","kinh_te_vn","kinh_te_qt","chung_khoan","crypto","flow","watch","links","x_posts"]);
const dayCache = {};
let feedDays = [], feedObs = null, feedBusy = false;
const OLDER = () => (TODAY.days || []).filter(d => d < TODAY.day).sort().reverse();
const dayLabel = d => { try { return new Date(d + "T12:00:00+07:00").toLocaleDateString("vi-VN", {weekday:"long", day:"2-digit", month:"2-digit", year:"numeric"}); } catch(e) { return d; } };
function viewHtml(n){
  return n.id === "tokens" ? renderTokens() : n.id === "x_ca" ? renderTokens(true)
    : n.id === "x_posts" ? renderXPosts() : n.id === "x_trend" ? renderXTrend()
    : n.id === "watch" ? renderWatch() : n.id === "flow" ? renderFlow() : n.id === "links" ? renderLinks()
    : n.id === "settings" ? renderSettings() : renderNews(n);
}
function withDay(d, fn){ const old = DATA; DATA = d; try { return fn(); } finally { DATA = old; } }
async function loadOlder(){
  if (feedBusy) return;
  const next = OLDER()[feedDays.length];
  const more = $("#more");
  if (!next) { if (more) more.textContent = "Đã hết tin. Dữ liệu được lưu tối đa 1 năm."; feedObs?.disconnect(); return; }
  feedBusy = true;
  if (more) more.textContent = `Đang tải ${dayLabel(next)}…`;
  try {
    if (!dayCache[next]) {
      const r = await fetch("api/day?day=" + next);
      if (!r.ok) throw new Error("Lỗi " + r.status);
      dayCache[next] = await r.json();
    }
    const n = cur();
    if (!FEED.has(n.id)) return;
    const html = withDay(dayCache[next], () => viewHtml(n));
    feedDays.push(next);
    more.insertAdjacentHTML("beforebegin", `<h2 class="dayhead" id="day-${next}">${esc(dayLabel(next))}</h2>${html}`);
    more.textContent = OLDER()[feedDays.length] ? "Lướt tiếp để xem ngày trước…" : "Đã hết tin. Dữ liệu được lưu tối đa 1 năm.";
  } catch(e) {
    if (more) more.textContent = "Chưa tải được ngày cũ (" + e.message + "). Lướt lại để thử.";
  } finally { feedBusy = false; }
  // nếu trang còn ngắn (ngày cũ ít tin) thì tải tiếp luôn
  if (more && more.getBoundingClientRect().top < innerHeight + 400 && OLDER()[feedDays.length]) loadOlder();
}
function armFeed(n){
  feedObs?.disconnect(); feedDays = [];
  if (!FEED.has(n.id) || !TODAY.api || !OLDER().length) return;
  $("#view").insertAdjacentHTML("beforeend", `<div id="more" role="status">Lướt xuống để xem ngày trước…</div>`);
  feedObs = new IntersectionObserver(es => { if (es.some(e => e.isIntersecting)) loadOlder(); }, {rootMargin: "600px 0px"});
  feedObs.observe($("#more"));
}

function render(){
  if (CHIPSEC[state.nav]) {  // mục có nút lọc: chỉ nút đang chọn được tính là đã đọc
    const key = state[CHIPSTATE[state.nav]];
    if (key !== "all" || allClicked) markChip(state.nav, key);
    allClicked = false;
  } else markSeen(state.nav);
  side(); bar();
  const n = cur();
  const html = viewHtml(n);
  $("#view").innerHTML = (FEED.has(n.id) && TODAY.api && OLDER().length ? `<h2 class="dayhead" id="day-${TODAY.day}">${esc(dayLabel(TODAY.day))}</h2>` : "") + html;
  armFeed(n);
  // Đổi mục: nội dung mới hiện mờ dần (ngắn, không trượt), tắt khi người dùng chọn giảm chuyển động
  if (fadeIn && !calm() && $("#view").animate) $("#view").animate([{opacity:0},{opacity:1}], {duration:160, easing:"cubic-bezier(.23,1,.32,1)"});
  fadeIn = false;
}

document.addEventListener("click", ev => {
  const b = ev.target.closest("button"); if (!b) return;
  if (b.dataset.nav) { state.nav = b.dataset.nav; history.replaceState(null, "", "#" + state.nav); window.scrollTo({top:0}); fadeIn = true; }
  else if (b.dataset.mode) state.mode = b.dataset.mode;
  else if (b.dataset.imp) state.minImp = Number(b.dataset.imp);
  else if (b.dataset.tag) state.tag = b.dataset.tag;
  else if (b.dataset.watch) { state.watch = b.dataset.watch; allClicked = b.dataset.watch === "all"; }
  else if (b.dataset.xacc) { state.xacc = b.dataset.xacc; allClicked = b.dataset.xacc === "all"; }
  else if (b.dataset.tkind) { state.tkind = b.dataset.tkind; allClicked = b.dataset.tkind === "all"; }
  else if (b.dataset.fgroup) { state.fgroup = b.dataset.fgroup; allClicked = b.dataset.fgroup === "all"; }
  else if (b.dataset.tokmore) state.tokLimit += 100;
  else if (b.dataset.more) { const el = document.getElementById(b.dataset.more); const open = el.classList.toggle("clamp6") === false; b.textContent = open ? "Thu gọn" : "Xem thêm"; return; }
  else if (b.id === "refreshBtn") { refreshNow(b); return; }
  else if (b.id === "themeBtn") {
    THEME = document.documentElement.classList.contains("is-dark") ? "light" : "dark";
    try { localStorage.setItem("digest-theme", THEME); } catch(e) {}
    applyTheme(THEME); return;
  }
  else if (b.dataset.del) {
    if (!b.dataset.armed) {  // nút xoá: bấm 2 lần để tránh xoá nhầm
      b.dataset.armed = "1"; b.textContent = "Bấm lần nữa để xoá";
      setTimeout(() => { if (b.isConnected) { delete b.dataset.armed; b.textContent = "Xoá"; } }, 4000);
      return;
    }
    api("DELETE", {kind: b.dataset.del, value: b.dataset.val}).then(j => { DATA.sources = j.sources; render(); })
      .catch(e => { const m = $("#f-msg"); if (m) { m.className = "msg err"; m.textContent = "Chưa xoá được: " + e.message; } });
    return;
  }
  else if (b.dataset.copy) {
    const v = b.dataset.copy, old = b.textContent;
    navigator.clipboard?.writeText(v).then(() => { b.textContent = "Đã chép"; setTimeout(() => b.textContent = old, 1200); })
      .catch(() => { b.textContent = v; });
    return;
  } else return;
  save(); render();
});
window.addEventListener("hashchange", () => { const v = location.hash.slice(1); if (navIds.includes(v)) { state.nav = v; render(); } });

applyTheme(THEME);
// Tự làm mới số liệu khi trang đang mở: 3 phút một lần và ngay khi quay lại tab. Chỉ cập nhật menu, nút lọc,
// số liệu góc trên (số chưa đọc, nguồn lỗi); nội dung đang đọc không bị nhảy, tin mới hiện khi bấm sang mục khác.
async function pollFresh(){
  if (document.hidden || !TODAY || !TODAY.api || DATA !== TODAY || TODAY.day !== vnToday()) return;
  try {
    const r = await fetch("api/day?day=" + TODAY.day, {cache: "no-store"});
    if (!r.ok) return;
    const d = await r.json();
    if (d.generated_at === TODAY.generated_at && JSON.stringify(d.sources?.health) === JSON.stringify(TODAY.sources?.health)) return;
    Object.assign(TODAY, d);
    header(); side(); bar();
  } catch(e) {}
}
setInterval(pollFresh, 3 * 60000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) pollFresh(); });
if (DATA) { header(); render(); } else { $("#view").innerHTML = `<p class="empty">Chưa có dữ liệu.</p>`; }
</script>
