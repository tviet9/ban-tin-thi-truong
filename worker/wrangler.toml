name = "tin"  # địa chỉ web: tin.<tên-miền-phụ>.workers.dev
main = "src/index.js"
compatibility_date = "2025-01-01"
workers_dev = true

[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = true

[triggers]
crons = ["7,37 * * * *"]  # mỗi 30 phút (phút 07 và 37): gọi lượt cập nhật trên GitHub

[vars]
GH_REPO = "__GH_REPO__"  # workflow Deploy tự điền (repo chứa workflow cập nhật)

[[d1_databases]]
binding = "DB"
database_name = "ban-tin"
database_id = "__D1_ID__"  # workflow Deploy tự điền
