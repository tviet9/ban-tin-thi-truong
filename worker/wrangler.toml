name = "ban-tin"
main = "src/index.js"
compatibility_date = "2025-01-01"
workers_dev = true

[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = true

[triggers]
crons = ["7 * * * *"]  # mỗi giờ phút 07: gọi lượt cập nhật trên GitHub

[vars]
GH_REPO = "__GH_REPO__"  # workflow Deploy tự điền (repo chứa workflow cập nhật)

[[d1_databases]]
binding = "DB"
database_name = "ban-tin"
database_id = "__D1_ID__"  # workflow Deploy tự điền
